name: Publish SolarEraser Chat

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Prepare versioned website
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${GITHUB_SHA:0:12}"

          
          mkdir -p _site/icons
          
          cp index.html main.js style.css CNAME manifest.json blasted.webp _site/

          cp icon-192.png icon-512.png _site/icons/
          cp -R styles _site/
          cp -R scripts _site/


          printf '{\n  "version": "%s"\n}\n' \
            "$VERSION" > _site/version.json

          python3 - "$VERSION" <<'PY'
          import pathlib
          import re
          import sys

          version = sys.argv[1]
          path = pathlib.Path("_site/index.html")
          html = path.read_text(encoding="utf-8")

          for filename in ("main.js", "style.css", "styles/cosmetics/index.css", "styles/base/foundation.css", "styles/components/toolbar.css", "styles/components/settings-panel.css", "styles/themes/chat-themes.css", "styles/layout/chat-interface-v1.css", "scripts/settings-panel.js"):
              pattern = (
                  r'(["\'])' +
                  re.escape(filename) +
                  r'(?:\?[^"\']*)?\1'
              )

              replacement = (
                  lambda match:
                  match.group(1) +
                  filename +
                  "?v=" + version +
                  match.group(1)
              )

              html, count = re.subn(
                  pattern,
                  replacement,
                  html
              )

              if count != 1:
                  raise RuntimeError(
                      f"Expected one reference to {filename}, "
                      f"found {count}"
                  )

          path.write_text(html, encoding="utf-8")
          PY

          # Bundle ordered core CSS for production (avoids extra CSS requests).
          python3 - <<'PYCSS'
          from pathlib import Path
          import re

          root = Path("_site")
          entry = root / "style.css"
          manifest = entry.read_text(encoding="utf-8")
          files = re.findall(r'^@import url\("\./([^"\n]+)"\);$', manifest, re.MULTILINE)
          if len(files) != 14:
              raise RuntimeError(f"Expected 14 core CSS imports, got {len(files)}")

          result = []
          for name in files:
              if not name.startswith("styles/") or ".." in Path(name).parts:
                  raise RuntimeError(f"Unexpected stylesheet path: {name}")
              path = root / name
              if not path.is_file():
                  raise RuntimeError(f"Missing stylesheet: {name}")
              result.append(path.read_text(encoding="utf-8"))
          entry.write_text("".join(result), encoding="utf-8")
          PYCSS
          sed -i "s|\.css\");|.css?v=${VERSION}\");|g" _site/styles/cosmetics/index.css
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
